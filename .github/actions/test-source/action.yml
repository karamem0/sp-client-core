name: Test source

description: This GitHub Action tests sources and uploads reports

runs:
  using: composite
  steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Test source
      shell: pwsh
      run: |
        dotnet test ${{env.TARGET_FILE}} `
          --filter TestCategory=Karamem0.SharePoint.PowerShell.Runtime `
          -p:AltCover=true `
          -- NUnit.TestOutputXml=${{github.workspace}}/source/test
      env:
        TARGET_FILE: source/Karamem0.SPClientCore.Test/Karamem0.SPClientCore.Test.csproj
    - name: Upload test results
      uses: enricomi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3
      if: always()
      with:
        files: |
          source/test/**/*.xml
        check_name: Test results
    - name: Upload coverage reports
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      if: always()
      with:
        fail_ci_if_error: true
        token: ${{env.CODECOV_TOKEN}}
        slug: karamem0/sp-client-core
